name: API Automated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Tests (${{ matrix.environment }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Start API Docker Container
        run: |
          docker run -d -p 3000:3000 --name api-service ghcr.io/danielsilva-loanpro/sdet-interview-challenge:latest
          sleep 3

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite (${{ matrix.environment }})
        env:
          AUTH_TOKEN: 'mysecrettoken'
          APP_HOST: 'http://localhost:3000'
        run: |
          pytest --env=${{ matrix.environment }} --alluredir=allure-results-${{ matrix.environment }}

      - name: Upload Raw Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.environment }}
          path: allure-results-${{ matrix.environment }}/
          retention-days: 1

  generate-and-deploy-report:
    name: Generate & Publish Allure Report
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Allure Results (DEV)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-dev
          path: allure-results-combined/dev
        continue-on-error: true

      - name: Download Allure Results (PROD)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-prod
          path: allure-results-combined/prod
        continue-on-error: true

      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxvf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure HTML Report
        run: |
          allure generate allure-results-combined -o allure-report --clean

      - name: Upload HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 7

      - name: Deploy Allure Report to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report